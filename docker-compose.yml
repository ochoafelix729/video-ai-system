services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: video_tutor
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - video_tutor_postgres:/var/lib/postgresql/data

volumes:
  video_tutor_postgres:
