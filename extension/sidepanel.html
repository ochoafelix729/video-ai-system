<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Tutor</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">AI VIDEO TUTOR</p>
        <h1>Ask about this video</h1>
      </header>
      <p id="video-status" role="status">Loading video context…</p>
      <button id="capture-button" type="button" disabled>Start tutoring</button>
      <section id="conversation" aria-live="polite"></section>
      <form id="question-form">
        <label for="question">Your question</label>
        <textarea
          id="question"
          name="question"
          placeholder="What is being explained here?"
          rows="4"
          disabled
        ></textarea>
        <button type="submit" disabled>Ask AI Tutor</button>
      </form>
      <p class="hint">Tutoring captures only this tab after you select Start tutoring.</p>
    </main>
    <script src="dist/config.js"></script>
    <script src="dist/auth.js"></script>
    <script src="dist/api.js"></script>
    <script type="module" src="dist/sidepanel.js"></script>
  </body>
</html>
